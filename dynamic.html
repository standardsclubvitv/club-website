<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Primary Meta Tags -->
    <title>BIS Standards Club VITV</title>
    <meta name="title" content="BIS Standards Club VITV">
    <meta name="description" content="Official website of BIS Standards Club at VIT Vellore">
    <meta name="keywords" content="BIS, Standards Club, VIT Vellore, VITV, Bureau of Indian Standards, student club">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.standardsvit.live/">
    <meta property="og:title" content="BIS Standards Club VITV">
    <meta property="og:description" content="Official website of BIS Standards Club at VIT Vellore">
    <meta property="og:image" content="https://standardsclubvitv.github.io/image-api/images/logo_club.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.standardsvit.live/">
    <meta property="twitter:title" content="BIS Standards Club VITV">
    <meta property="twitter:description" content="Official website of BIS Standards Club at VIT Vellore">
    <meta property="twitter:image" content="https://standardsclubvitv.github.io/image-api/images/logo_club.png">

    <!-- Additional Tags -->
    <meta name="author" content="Pranav Rayban">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://standardsclubvitv.github.io/image-api/images/logo_club.png">
    <link rel="apple-touch-icon" href="https://standardsclubvitv.github.io/image-api/images/logo_club.png">
</head>

<body>
    <!-- Particle Background -->
    <div id="particles-js"></div>

    <!-- Header Section -->
    <header>
        <div class="container">
            <!-- Content will be rendered by JavaScript -->
        </div>
    </header>

    <!-- Hero Section with Slider -->
    <section class="hero" id="home">
        <!-- Content will be rendered by JavaScript -->
    </section>

    <!-- About BIS Section -->
    <section class="about-bis" id="about-bis">
        <!-- Content will be rendered by JavaScript -->
    </section>

    <!-- About Club Section -->
    <section class="about-club" id="about-club">
        <!-- Content will be rendered by JavaScript -->
    </section>

    <!-- Team Section -->
    <section class="team" id="team">
        <!-- Content will be rendered by JavaScript -->
    </section>

    <!-- Events Section -->
    <section class="events" id="events">
        <!-- Content will be rendered by JavaScript -->
    </section>

    <!-- Contact Section -->
    <section class="contact" id="contact">
        <!-- Content will be rendered by JavaScript -->
    </section>

    <!-- Footer -->
    <footer>
        <!-- Content will be rendered by JavaScript -->
    </footer>

    <!-- Loading Indicator -->
    <div id="loading-indicator" style="
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 83, 156, 0.9);
        color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        z-index: 9999;
        display: block;
    ">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading BIS Standards Club...</p>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="data.js"></script>
    <script src="pageRenderer.js"></script>
    <script src="index.js"></script>
    
    <script>
        // Initialize the website
        document.addEventListener('DOMContentLoaded', () => {
            // Hide loading indicator after initialization
            setTimeout(() => {
                const loadingIndicator = document.getElementById('loading-indicator');
                if (loadingIndicator) {
                    loadingIndicator.style.display = 'none';
                }
            }, 2000);
            
            // Initialize the BIS Club website
            window.BISClub.init();
        });
    </script>
</body>

</html>
